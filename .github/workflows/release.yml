name: Build and Release GPU-CR Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.2.2-devel-ubuntu22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            cmake build-essential git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Build Release Artifacts via Makefile
        run: |
          make release-local

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/cr_client
            build/vGPU-NVIDIA.so
            build/checksums.sha256
          generate_release_notes: true
